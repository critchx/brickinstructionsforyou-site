<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">Brick Instructions For You</title>
  <desc id="desc">A red brick icon beside the Brick Instructions For You wordmark.</desc>
  <defs>
