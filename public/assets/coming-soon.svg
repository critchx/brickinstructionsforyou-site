<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061b35"/>
      <stop offset="55%" stop-color="#082544"/>
      <stop offset="100%" stop-color="#0d315a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="studShadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- subtle background brick outlines -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="4" fill="none">
    <g transform="translate(70 70) rotate(-18)">
      <rect x="0" y="0" width="120" height="70" rx="10"/>
      <circle cx="32" cy="22" r="11"/><circle cx="70" cy="22" r="11"/>
      <circle cx="32" cy="50" r="11"/><circle cx="70" cy="50" r="11"/>
    </g>
    <g transform="translate(1000 88) rotate(18)">
      <rect x="0" y="0" width="150" height="85" rx="12"/>
      <circle cx="38" cy="28" r="12"/><circle cx="82" cy="28" r="12"/>
      <circle cx="38" cy="60" r="12"/><circle cx="82" cy="60" r="12"/>
    </g>
    <g transform="translate(125 510) rotate(19)">
      <rect x="0" y="0" width="135" height="80" rx="11"/>
      <circle cx="35" cy="26" r="11"/><circle cx="78" cy="26" r="11"/>
      <circle cx="35" cy="56" r="11"/><circle cx="78" cy="56" r="11"/>
    </g>
    <g transform="translate(980 510) rotate(-20)">
      <rect x="0" y="0" width="130" height="78" rx="11"/>
      <circle cx="34" cy="26" r="11"/><circle cx="76" cy="26" r="11"/>
      <circle cx="34" cy="55" r="11"/><circle cx="76" cy="55" r="11"/>
    </g>
    <g transform="translate(1040 300) rotate(-34)">
      <rect x="0" y="0" width="115" height="65" rx="10"/>
      <circle cx="32" cy="22" r="10"/><circle cx="70" cy="22" r="10"/>
    </g>
  </g>

  <!-- main white brick -->
  <g filter="url(#softShadow)">
    <rect x="250" y="255" width="780" height="205" rx="28" fill="#f8fafc"/>
    <rect x="250" y="255" width="780" height="205" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="3"/>
  </g>

  <!-- studs -->
  <g filter="url(#studShadow)">
    <ellipse cx="397" cy="255" rx="73" ry="42" fill="#ffffff"/>
    <rect x="324" y="215" width="146" height="40" fill="#f8fafc"/>
    <ellipse cx="397" cy="215" rx="73" ry="42" fill="#ffffff"/>

    <ellipse cx="640" cy="255" rx="73" ry="42" fill="#ffffff"/>
    <rect x="567" y="215" width="146" height="40" fill="#f8fafc"/>
    <ellipse cx="640" cy="215" rx="73" ry="42" fill="#ffffff"/>

    <ellipse cx="883" cy="255" rx="73" ry="42" fill="#ffffff"/>
    <rect x="810" y="215" width="146" height="40" fill="#f8fafc"/>
    <ellipse cx="883" cy="215" rx="73" ry="42" fill="#ffffff"/>
  </g>

  <!-- text -->
  <text x="640" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="900" fill="#061b35" letter-spacing="4">COMING SOON</text>
  <line x1="365" y1="390" x2="420" y2="390" stroke="#ffcc00" stroke-width="8" stroke-linecap="round"/>
  <line x1="860" y1="390" x2="915" y2="390" stroke="#ffcc00" stroke-width="8" stroke-linecap="round"/>
  <text x="640" y="404" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900" fill="#061b35">LEGO® INSTRUCTION VIDEO</text>

  <text x="640" y="565" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900" fill="#ffffff">Brick Instructions For You</text>
</svg>